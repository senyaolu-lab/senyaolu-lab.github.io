<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人短片两则 · 游戏二创 & 奇幻短片</title>
<link rel="stylesheet" href="portfolio.css">
<style>
  body{font-family:var(--font-sans);background:var(--c-bg);color:var(--c-ink);}

  .nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:20px var(--pad-x);
    background:rgba(251,250,247,.82);
    backdrop-filter:blur(18px) saturate(160%);
    border-bottom:1px solid var(--c-line-soft);
  }
  .nav__back{font-size:var(--t-small);color:var(--c-ink-3);text-decoration:none;
    transition:color .3s var(--ease);}
  .nav__back:hover{color:var(--c-ink);}
  .nav__id{font-size:13.5px;font-weight:700;letter-spacing:.02em;}

  .head{padding:calc(var(--pad-sec) * 1.25) 0 var(--s-7);}
  .head__badge{
    display:inline-flex;align-items:center;gap:9px;
    font-family:var(--font-lat);font-size:var(--t-micro);letter-spacing:.22em;
    text-transform:uppercase;font-weight:700;color:var(--c-ink);
    border:1px solid var(--c-ink);border-radius:999px;padding:7px 16px;
    margin-bottom:var(--s-6);
  }
  .head__badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c-ink);}
  .head__title{font-size:var(--t-h1);line-height:1.08;letter-spacing:-.03em;font-weight:900;margin:0 0 var(--s-5);}
  .head__title .dim{color:var(--c-mute);font-weight:300;}
  .head__sub{font-size:var(--t-lead);color:var(--c-ink-2);max-width:58ch;line-height:1.8;margin:0;}

  .item{padding:var(--pad-sec) 0 0;}
  .item__kicker{font-family:var(--font-lat);font-size:var(--t-micro);letter-spacing:.22em;
    text-transform:uppercase;color:var(--c-mute);font-weight:700;margin-bottom:var(--s-4);}
  .item__title{font-size:var(--t-h2);line-height:1.14;letter-spacing:-.022em;font-weight:900;margin:0 0 var(--s-4);}
  .item__desc{font-size:var(--t-body);color:var(--c-ink-2);line-height:1.88;margin:0 0 var(--s-5);max-width:58ch;}

  .meta{display:flex;flex-wrap:wrap;gap:var(--s-5) var(--s-7);
    padding:var(--s-4) 0;margin:0 0 var(--s-6);
    border-top:1px solid var(--c-line);border-bottom:1px solid var(--c-line);}
  .meta div{display:flex;flex-direction:column;gap:4px;}
  .meta dt{font-family:var(--font-lat);font-size:var(--t-micro);letter-spacing:.2em;
    text-transform:uppercase;color:var(--c-mute);font-weight:600;}
  .meta dd{margin:0;font-size:var(--t-small);color:var(--c-ink-2);}

  /* 视频按各自画幅显示，不裁切 */
  .item video{
    width:100%;height:auto;display:block;
    background:#000;border:1px solid var(--c-line);
  }

  .mats{margin-top:var(--s-8);}
  .mats__grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:var(--s-4);}
  .mats__grid img{width:100%;display:block;border:1px solid var(--c-line);}

  .foot{border-top:1px solid var(--c-line);padding:var(--s-7) 0;margin-top:var(--pad-sec);}
  .foot__row{display:flex;justify-content:space-between;gap:var(--s-5);flex-wrap:wrap;
    font-size:var(--t-cap);color:var(--c-mute);}
  .foot__row a{color:var(--c-ink-3);text-decoration:none;border-bottom:1px solid var(--c-line);}
  .foot__row a:hover{color:var(--c-ink);border-color:var(--c-ink);}

  @media (max-width:700px){
    .mats__grid{grid-template-columns:1fr;}
  }
  @media print{
    img,figure,table,blockquote{break-inside:avoid !important;}
    @page{size:A4;margin:12mm;}
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
    .nav{display:none !important;}
    .head{padding:0 0 var(--s-5) !important;}
    .item{padding:var(--s-6) 0 0 !important;page-break-inside:avoid;}
    .mats__grid img{break-inside:avoid;}
    .foot{margin-top:var(--s-6);padding:var(--s-5) 0 !important;}
  }
</style>
</head>
<body class="pf">

<nav class="nav">
  <a class="nav__back" href="index.html">← 返回作品集</a>
  <div class="nav__id">个人创作 · 短片两则</div>
</nav>

<header class="head pf-wrap">
  <div class="head__badge">个人创作</div>
  <h1 class="head__title">短片两则<br><span class="dim">游戏二创 &amp; 奇幻短片</span></h1>
  <p class="head__sub">
    两条个人短片。
  </p>
</header>

<main class="pf-wrap">

  <!-- 一 -->
  <section class="item">
    <div class="item__kicker">01 · 游戏二创</div>
    <h2 class="item__title">拆包吧 瓦学弟！</h2>
    <p class="item__desc">《无畏契约》与 CS:GO 的混剪二创。</p>
    <dl class="meta">
      <div><dt>Type</dt><dd>游戏二创 / 混剪</dd></div>
      <div><dt>Format</dt><dd>1280 × 548 · 7:3 · 41s</dd></div>
    </dl>
    <video src="images/personal/unbox.mp4" poster="images/personal/unbox-poster.jpg"
           preload="metadata" playsinline controls></video>

    <div class="mats">
      <div class="pf-label">部分素材</div>
      <div class="mats__grid">
        <img src="images/personal/fan-01-c4.jpg" alt="">
        <img src="images/personal/fan-02-vfx.jpg" alt="">
        <img src="images/personal/fan-03-terrorist.jpg" alt="">
        <img src="images/personal/fan-04-phoenix.jpg" alt="">
        <img src="images/personal/fan-05-bullet.jpg" alt="">
        <img src="images/personal/fan-06-revolver.jpg" alt="">
      </div>
    </div>
  </section>

  <!-- 二 -->
  <section class="item">
    <div class="item__kicker">02 · 奇幻短片</div>
    <h2 class="item__title">带着豆包勇闯异世界</h2>
    <p class="item__desc">一条奇幻题材的短片，非最终版。</p>
    <dl class="meta">
      <div><dt>Type</dt><dd>奇幻短片 / AI 内容</dd></div>
      <div><dt>Format</dt><dd>1280 × 720 · 16:9 · 1 分 57 秒</dd></div>
    </dl>
    <video src="images/personal/doubao.mp4" poster="images/personal/doubao-poster.jpg"
           preload="metadata" playsinline controls></video>

    <div class="mats">
      <div class="pf-label">部分素材</div>
      <div class="mats__grid">
        <img src="images/personal/dou-01-dragon.jpg" alt="">
        <img src="images/personal/dou-02-staff.jpg" alt="">
        <img src="images/personal/dou-03-witch.jpg" alt="">
        <img src="images/personal/dou-04-cape.jpg" alt="">
        <img src="images/personal/dou-05-dress.jpg" alt="">
      </div>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="pf-wrap foot__row">
    <span>吕森垚 · 2027 届 · 山西传媒学院</span>
    <a href="index.html">返回作品集</a>
  </div>
</footer>

</body>
</html>
