<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hisense IFA Berlin 2024 · 社媒短片</title>
<link rel="stylesheet" href="portfolio.css">
<style>
  body{font-family:var(--font-sans);background:var(--c-bg);color:var(--c-ink);}

  .nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:20px var(--pad-x);
    background:rgba(251,250,247,.82);
    backdrop-filter:blur(18px) saturate(160%);
    border-bottom:1px solid var(--c-line-soft);
  }
  .nav__back{font-size:var(--t-small);color:var(--c-ink-3);text-decoration:none;
    transition:color .3s var(--ease);}
  .nav__back:hover{color:var(--c-ink);}
  .nav__id{font-size:13.5px;font-weight:700;letter-spacing:.02em;}

  .wrap{padding:calc(var(--pad-sec) * 1.2) 0 var(--pad-sec);}
  .inner{display:grid;grid-template-columns:300px 1fr;gap:var(--s-10);align-items:start;}

  /* 左：手机 */
  .phone{
    width:300px;border:8px solid #0C0F12;border-radius:28px;background:#0C0F12;
    overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.22);
  }
  .phone video{width:100%;display:block;aspect-ratio:9/16;object-fit:cover;background:#000;}
  .phone__play{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:58px;height:58px;border-radius:50%;border:0;padding-left:4px;
    background:rgba(255,255,255,.94);color:var(--c-ink);font-size:19px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .3s var(--ease);
  }
  .phone__play:hover{transform:translate(-50%,-50%) scale(1.08);}
  .phone.playing .phone__play{opacity:0;pointer-events:none;}

  /* 右：信息 */
  .info{padding-top:6px;max-width:52ch;}
  .info__tag{
    display:inline-block;font-family:var(--font-lat);font-size:var(--t-micro);
    letter-spacing:.2em;text-transform:uppercase;font-weight:700;
    color:var(--c-ink);border:1px solid var(--c-line);border-radius:999px;
    padding:6px 14px;margin-bottom:var(--s-5);
  }
  .info__title{font-size:var(--t-h2);line-height:1.12;letter-spacing:-.025em;
    font-weight:900;margin:0 0 var(--s-5);}
  .info__title .dim{color:var(--c-mute);font-weight:300;}
  .info__desc{font-size:var(--t-body);color:var(--c-ink-2);line-height:1.88;margin:0 0 var(--s-6);}

  .meta{display:flex;flex-wrap:wrap;gap:var(--s-5) var(--s-7);
    padding:var(--s-5) 0;margin:0 0 var(--s-6);
    border-top:1px solid var(--c-line);border-bottom:1px solid var(--c-line);}
  .meta div{display:flex;flex-direction:column;gap:4px;}
  .meta dt{font-family:var(--font-lat);font-size:var(--t-micro);letter-spacing:.2em;
    text-transform:uppercase;color:var(--c-mute);font-weight:600;}
  .meta dd{margin:0;font-size:var(--t-small);color:var(--c-ink-2);}

  .btn{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--c-ink);color:#fff;text-decoration:none;
    font-size:var(--t-small);font-weight:700;letter-spacing:.04em;
    padding:14px 26px;border-radius:999px;
    transition:transform .32s var(--ease),opacity .32s var(--ease);
  }
  .btn:hover{transform:translateY(-2px);opacity:.9;}
  .btn--ghost{background:transparent;color:var(--c-ink);border:1px solid var(--c-line);
    cursor:pointer;font-family:inherit;}
  .btn--ghost:hover{border-color:var(--c-ink);}
  .row{display:flex;gap:10px;flex-wrap:wrap;}

  .note{margin-top:var(--s-6);font-size:var(--t-cap);color:var(--c-mute);
    line-height:1.8;max-width:46ch;}

  .foot{border-top:1px solid var(--c-line);padding:var(--s-7) 0;margin-top:var(--pad-sec);}
  .foot__row{display:flex;justify-content:space-between;gap:var(--s-5);flex-wrap:wrap;
    font-size:var(--t-cap);color:var(--c-mute);}
  .foot__row a{color:var(--c-ink-3);text-decoration:none;border-bottom:1px solid var(--c-line);}
  .foot__row a:hover{color:var(--c-ink);border-color:var(--c-ink);}

  @media (max-width:820px){
    .inner{grid-template-columns:1fr;gap:var(--s-8);}
    .phone{width:100%;max-width:300px;margin:0 auto;}
  }
  @media print{
    @page{size:A4;margin:14mm;}
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
    .nav,.phone__play,.row{display:none !important;}
    .wrap{padding:0 !important;}
    .inner{grid-template-columns:230px 1fr;gap:12mm;}
    .phone{border-width:5px;border-radius:20px;width:230px;box-shadow:none;}
    .foot{margin-top:var(--s-6);padding:var(--s-5) 0 !important;}
  }
</style>
</head>
<body class="pf">

<nav class="nav">
  <a class="nav__back" href="index.html">← 返回作品集</a>
  <div class="nav__id">Hisense · 社媒短片</div>
</nav>

<main class="wrap pf-wrap">
  <div class="inner">

    <div>
      <div class="phone" id="phone">
        <video id="hv" src="images/hisense/hisense-wip.mp4"
               poster="images/hisense/still-01-ifa.jpg"
               preload="metadata" playsinline muted></video>
        <button class="phone__play" id="hplay" type="button">▶</button>
      </div>
    </div>

    <div class="info">
      <span class="info__tag">社媒短片 · 真实交付</span>
      <h1 class="info__title">Hisense<br><span class="dim">IFA Berlin 2024</span></h1>
      <p class="info__desc">
        为海信 IFA Berlin 2024 制作的一条竖版社媒短片，已发布在 <strong>@hisense 官方 TikTok 账号</strong>。
        57 秒走完整条产品线——电视、洗烘、冰箱、空调、投影，收在 ConnectLife 智能家居。
      </p>

      <dl class="meta">
        <div><dt>Client</dt><dd>Hisense 海信</dd></div>
        <div><dt>Role</dt><dd>内容制作</dd></div>
        <div><dt>Format</dt><dd>1440 × 2560 · 57s</dd></div>
      </dl>

      <div class="row">
        <a class="btn" href="https://www.tiktok.com/@hisense/video/7680332933458054413" target="_blank" rel="noopener">▶ 官方完成品</a>
        <button class="btn btn--ghost" id="hreplay" type="button">↺ 重播</button>
      </div>

      <p class="note">
        左侧是我制作中的半成品。最终上线版由品牌方完成后期调色与包装。
      </p>
    </div>

  </div>
</main>

<footer class="foot">
  <div class="pf-wrap foot__row">
    <span>吕森垚 · 2027 届 · 山西传媒学院</span>
    <a href="index.html">返回作品集</a>
  </div>
</footer>

<script>
(function () {
  var v = document.getElementById('hv');
  var ph = document.getElementById('phone');
  var play = document.getElementById('hplay');
  var replay = document.getElementById('hreplay');
  function run() {
    if (!v) return;
    ph.classList.add('playing');
    v.muted = false; v.currentTime = 0;
    var p = v.play();
    if (p && p.catch) { p.catch(function () { v.muted = true; v.play(); }); }
  }
  if (play) play.addEventListener('click', run);
  if (replay) replay.addEventListener('click', run);
  if (v) v.addEventListener('ended', function () {
    ph.classList.remove('playing'); v.muted = true;
  });
})();
</script>

</body>
</html>
